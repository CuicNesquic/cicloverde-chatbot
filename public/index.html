<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CICLOVERDE — Asistente Virtual</title>
  <style>
    :root {
      --bg: #f3f7f4;
      --card: #ffffff;
      --primary: #2d6a4f;
      --primary-dark: #1b4332;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d9e2ec;
      --user-bg: #d8f3dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 82vh;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header p { font-size: 0.82rem; opacity: 0.9; margin-top: 2px; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.45;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .msg.bot {
      align-self: flex-start;
      background: #f0f4f8;
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--primary-dark);
      border-bottom-right-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: #fde8e8;
      color: #9b1c1c;
      font-size: 0.85rem;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <div>
        <h1>CICLOVERDE</h1>
        <p>Asistente virtual de módulos biodegradables</p>
      </div>
      <span id="status" class="status-badge">Verificando...</span>
    </header>
    <div id="messages">
      <div class="msg bot">¡Hola! Soy el asistente de CICLOVERDE. Pregúntame sobre nuestra propuesta de módulos biodegradables con semillas a partir de residuos orgánicos.</div>
    </div>
    <form id="chat-form">
      <input id="message-input" type="text" placeholder="Escribe tu pregunta..." maxlength="2000" required autocomplete="off" />
      <button id="send-btn" type="submit">Enviar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');
    let previousResponseId = null;

    function appendMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        statusEl.textContent = data.aiConfigured ? 'En línea' : 'Sin clave API';
      })
      .catch(() => {
        statusEl.textContent = 'Sin conexión';
      });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;
      const thinkingMsg = appendMessage('Escribiendo...', 'bot');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, previousResponseId })
        });
        const data = await res.json();
        thinkingMsg.remove();

        if (!res.ok) {
          appendMessage(data.error || 'Error al responder.', 'error');
        } else {
          appendMessage(data.answer, 'bot');
          if (data.responseId) previousResponseId = data.responseId;
        }
      } catch {
        thinkingMsg.remove();
        appendMessage('No se pudo conectar con el servidor.', 'error');
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
